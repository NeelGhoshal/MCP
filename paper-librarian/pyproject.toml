[project]
name = "paper-librarian"
version = "0.1.0"
description = "MCP server for a local, searchable library of research papers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pymupdf>=1.24",
    "arxiv>=2.1",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper-librarian = "librarian.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
